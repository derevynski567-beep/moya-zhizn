/* V12 — premium, responsive redesign */
:root{
 --bg:#f3f5fb;--card:rgba(255,255,255,.88);--ink:#172033;--muted:#727d92;
 --line:#e3e8f2;--blue:#5b5cf0;--blue2:#eeefff;--green:#078568;--red:#dc4d69;--radius:22px;
 color-scheme:light;
}
html{scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse at 8% -8%,rgba(113,123,255,.16),transparent 34rem),
  radial-gradient(ellipse at 100% 10%,rgba(73,202,190,.10),transparent 28rem),
  var(--bg);
 color:var(--ink);letter-spacing:-.01em;
}
.app{max-width:1280px;padding:28px 28px 110px}
.top{margin-bottom:26px}
.brand{font-size:25px;letter-spacing:-1.1px;font-weight:850}
.date-label{font-size:13px;letter-spacing:.01em}
.avatar{width:46px;height:46px;border:1px solid #ffffff;background:linear-gradient(145deg,#e9eaff,#dce3ff);box-shadow:0 6px 20px #5b5cf01b}
.hero{
 position:relative;overflow:hidden;isolation:isolate;
 background:linear-gradient(120deg,#202d72 0%,#4549cb 48%,#7378ff 100%);
 border:1px solid #ffffff35;border-radius:30px;padding:30px;
 box-shadow:0 22px 55px rgba(54,63,165,.22);margin-bottom:24px;
}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%}
.hero:before{width:380px;height:380px;right:-80px;top:-240px;border:1px solid #ffffff30;box-shadow:0 0 0 35px #ffffff08,0 0 0 75px #ffffff06}
.hero:after{width:220px;height:220px;right:18%;bottom:-190px;background:#9ef3e81c;filter:blur(3px)}
.hero h1{font-size:clamp(25px,3vw,34px);letter-spacing:-1.2px;margin:10px 0}
.hero p{max-width:650px;line-height:1.6}
.hero-stats{gap:14px;margin-top:26px}
.hero-stat{background:#ffffff12;border:1px solid #ffffff30;border-radius:18px;padding:16px 17px;backdrop-filter:blur(10px);transition:transform .2s,background .2s}
.hero-stat:hover{transform:translateY(-2px);background:#ffffff1c}
.hero-stat b{font-size:clamp(20px,2.2vw,25px);letter-spacing:-.7px}
.hero-stat span{display:block;margin-top:4px}
.tabs{gap:8px;padding:6px;background:#e7eaf4b8;border:1px solid #ffffffa6;border-radius:18px;margin-bottom:26px}
.tab{padding:13px 18px;border-radius:13px;font-size:14px;transition:background .18s,color .18s,box-shadow .18s}
.tab:hover:not(.active){background:#ffffff80;color:var(--ink)}
.tab.active{background:#fff;color:#3439a7;box-shadow:0 4px 14px #303b7810}
.section-head{margin:24px 0 14px}
.section-head h2{font-size:19px;letter-spacing:-.6px}
.card,.metric{
 background:var(--card);border:1px solid #e5e9f3;border-radius:var(--radius);
 box-shadow:0 8px 24px rgba(33,45,88,.035);backdrop-filter:blur(16px);
}
.card{padding:22px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#d8def1;box-shadow:0 12px 30px rgba(33,45,88,.055)}
.metric-grid{gap:14px}
.metric{padding:18px}
.metric .label{font-weight:600;letter-spacing:.01em}
.metric b{font-size:clamp(19px,2vw,25px);letter-spacing:-.7px}
.metric .note{line-height:1.5}
.btn{border-radius:13px;padding:11px 16px;transition:transform .16s,box-shadow .16s,filter .16s;font-weight:750}
.btn:hover{filter:brightness(1.02);transform:translateY(-1px);box-shadow:0 6px 15px #2e3a7414}
.btn:active{transform:translateY(0)}
.btn:not(.light):not(.ghost):not(.danger){background:linear-gradient(135deg,#5559e9,#7377ff);box-shadow:0 5px 14px #5b5cf02a}
.btn.light{background:#eff0ff;color:#4247c5}
.btn.ghost{background:#f0f2f8;color:#48536a}
.btn.danger{background:#fff0f3;color:#c93455}
.row-item{padding:15px 0}
.row-main b{font-size:14px;letter-spacing:-.15px}
.check{border-radius:7px;width:20px;height:20px;border-color:#c5cce0}
.check:checked{background:#5b5cf0;border-color:#5b5cf0}
.dot{background:linear-gradient(135deg,#7b80ff,#4ccbb8);box-shadow:0 0 0 4px #777cff18}
.object-card{gap:16px}
.object-title h3{font-size:17px;letter-spacing:-.4px}
.pill{border-radius:999px;padding:6px 10px;font-weight:700}
.pill.gray{background:#f0f2f8}
.object-numbers span{line-height:1.4}
.object-numbers b{font-size:15px}
.field label{font-size:12px;letter-spacing:.01em}
.field input,.field select,.field textarea,.day-controls input,#cloud-email,#cloud-password{
 border:1px solid #dce2ef!important;border-radius:13px!important;background:#fbfcff!important;
 transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus,.field textarea:focus,#cloud-email:focus,#cloud-password:focus{
 border-color:#8588ff!important;box-shadow:0 0 0 4px #686cff19!important;outline:none
}
.note-box{background:linear-gradient(135deg,#f6f7ff,#f2fbfa);border:1px solid #e7eaf9;border-radius:16px}
.progress{height:8px;background:#e9ecf6}
.progress span{background:linear-gradient(90deg,#575be9,#55c8ba)}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.table td{line-height:1.5}
.overlay{backdrop-filter:blur(8px);background:#131a3180}
.modal{border:1px solid #ffffffb8;border-radius:26px;box-shadow:0 28px 80px #10152e35;padding:24px}
.close{border-radius:12px}
.toast{border:1px solid #ffffff24;box-shadow:0 15px 40px #151b3340}
#root{min-height:100vh}
#root>section.card{
 position:relative;z-index:12;max-width:1224px!important;
 margin:10px auto 24px!important;padding:20px 22px!important;
 background:rgba(255,255,255,.9)!important;border:1px solid #e1e6f3!important;
 border-radius:22px!important;box-shadow:0 12px 32px #26366d0b!important;
 backdrop-filter:blur(18px);
}
#root>section.card> b{font-size:15px;letter-spacing:-.2px}
#cloud-status{line-height:1.55;overflow-wrap:anywhere}
#cloud-form button{min-height:44px}
#cloud-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cloud-controls .btn{margin:0}
.bottom-nav{
 background:#f8f9ffed;border-top:1px solid #e1e6f3;
 box-shadow:0 -8px 28px #28365c0a;padding-top:11px;
}
.bottom-nav button{font-size:11px;font-weight:650;gap:5px}
.bottom-nav button span{font-size:20px}
.bottom-nav button.active{color:#5155dc}
@media(min-width:701px){
 .app{padding-top:26px}
 .grid{gap:20px}
 .card{padding:24px}
}
@media(max-width:700px){
 .app{padding:16px 13px 104px}
 .brand{font-size:21px}
 .hero{padding:22px 19px;border-radius:25px}
 .hero h1{font-size:25px}
 .hero-stats{gap:8px;margin-top:20px}
 .hero-stat{padding:11px 10px;border-radius:14px}
 .hero-stat b{font-size:17px}
 .hero-stat span{font-size:10px;line-height:1.35}
 .metric-grid{gap:8px}
 .metric{padding:13px 11px;border-radius:16px}
 .card{padding:16px;border-radius:20px}
 #root>section.card{margin:8px 8px 16px!important;padding:16px!important;border-radius:19px!important}
 #cloud-form{grid-template-columns:1fr!important}
 #cloud-form input{min-width:0;width:100%}
 #cloud-controls{display:flex;gap:7px}
 #cloud-controls .btn{flex:1}
 .section-head{margin-top:21px}
 .modal{padding:18px;border-radius:22px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

<body>
<div id="root"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtDate=s=>{if(!s)return '';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})};
const defaultState=()=>({tasks:[{id:uid(),date:today(),time:'09:00',title:'Проверить задачи на день',note:'',done:false},{id:uid(),date:today(),time:'11:00',title:'Связаться с заказчиком',note:'Уточнить статус работ',done:false}],entries:[],objects:[],transactions:[],journal:[],schedule:[],currency:'RUB'});
let state;try{state=JSON.parse(localStorage.getItem('moya-zhizn-data'))||defaultState()}catch(e){state=defaultState()}
/* Recover safely from older or partial saved schemas without deleting user data. */
(function normalizeSavedState(){
  const defaults=defaultState();
  if(!state || typeof state!=='object' || Array.isArray(state)) state=defaults;
  for(const key of ['tasks','entries','objects','transactions','journal','schedule']){
    if(!Array.isArray(state[key])) state[key]=defaults[key];
    else state[key]=state[key].filter(item=>item && typeof item==='object' && !Array.isArray(item));
  }
  if(typeof state.currency!=='string') state.currency=defaults.currency;
})();
let tab='today',selectedDate=today(),modal=null,toastTimer;
function save(){
  const key='moya-zhizn-data';
  try{
    const previous=localStorage.getItem(key);
    if(previous && previous!==JSON.stringify(state)){
      try{localStorage.setItem('moya-zhizn-auto-backup',JSON.stringify({savedAt:new Date().toISOString(),data:JSON.parse(previous)}))}catch(backupError){}
    }
    localStorage.setItem(key,JSON.stringify(state));
  }catch(error){
    console.error('Local save failed',error);
    alert('Не удалось сохранить изменения в браузере. Освободи место в хранилище и сразу экспортируй резервную копию в разделе «Финансы».');
  }
}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function totalExpense(objId){return state.transactions.filter(t=>t.objectId===objId&&t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0)}
function totalIncome(objId){return state.transactions.filter(t=>t.objectId===objId&&t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0)}
function objProfit(o){return Number(o.revenue||0)-totalExpense(o.id)}
function totalExpenses(){return state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0)}
function totalIncomes(){return state.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0)}
function netProfit(){return totalIncomes()-totalExpenses()}
function objName(id){return state.objects.find(o=>o.id===id)?.name||'Без объекта'}
function btn(label,action,cls='light'){return '<button type="button" class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}
function metric(label,value,note='',tone=''){return '<div class="metric"><div class="label">'+label+'</div><b class="'+tone+'">'+value+'</b><div class="note">'+note+'</div></div>'}
function head(title,right=''){return '<div class="section-head"><h2>'+title+'</h2>'+right+'</div>'}
function itemsForDate(arr){return arr.filter(x=>x.date===selectedDate)}
function render(){
const d=new Date(selectedDate+'T12:00:00');const greeting=(new Date().getHours()<12?'Доброе утро':new Date().getHours()<18?'Добрый день':'Добрый вечер');
const todayTasks=itemsForDate(state.tasks).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const activeObjects=state.objects.filter(o=>o.status!=='Завершён');
const done=todayTasks.filter(t=>t.done).length;
$('#root').innerHTML='<main class="app"><header class="top"><div><div class="brand">✦ Моя жизнь</div><div class="date-label">'+fmtDate(today())+' · личный штаб</div></div><div class="avatar">МЖ</div></header>'
+'<section class="hero"><small>'+greeting+'!</small><h1>'+ (selectedDate===today()?'Твой день — в твоих руках':'План на '+fmtDate(selectedDate))+'</h1><p>Держи в фокусе главное — дела, жизнь и результат.</p><div class="hero-stats"><div class="hero-stat"><b>'+done+'/'+todayTasks.length+'</b><span>дел выполнено</span></div><div class="hero-stat"><b>'+activeObjects.length+'</b><span>активных объектов</span></div><div class="hero-stat"><b>'+money(netProfit())+'</b><span>доходы − расходы</span></div></div></section>'
+'<nav class="tabs">'+navButtons()+'</nav>'+renderTab()+'</main><nav class="bottom-nav">'+navButtons(true)+'</nav>'
+(modal?renderModal():'');
bindEvents();
}
function navButtons(mobile=false){const list=[['today','☀','Сегодня'],['journal','▤','Журнал'],['objects','⌂','Объекты'],['finance','₽','Финансы']];return list.map(([id,icon,label])=>'<button class="tab '+(tab===id?'active':'')+'" data-tab="'+id+'">'+(mobile?'<span>'+icon+'</span>':'')+label+'</button>').join('')}
function renderTab(){
if(tab==='today')return renderToday();
if(tab==='journal')return renderJournal();
if(tab==='objects')return renderObjects();
return renderFinance();
}
function renderToday(){
const tasks=itemsForDate(state.tasks).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const sched=itemsForDate(state.schedule).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const entry=state.journal.find(j=>j.date===selectedDate);
return '<div class="section-head"><h2>План дня</h2><div class="day-controls"><button class="btn ghost" data-action="prev-day">‹</button><input type="date" id="selected-date" value="'+selectedDate+'"><button class="btn ghost" data-action="next-day">›</button></div></div><div class="grid"><section class="card">'+head('Задачи',btn('+ Добавить','add-task'))+(tasks.length?tasks.map(t=>'<div class="row-item"><input class="check" type="checkbox" data-action="toggle-task" data-id="'+t.id+'" '+(t.done?'checked':'')+'><div class="time">'+esc(t.time||'—')+'</div><div class="row-main"><b style="'+(t.done?'text-decoration:line-through;color:#8b93a0':'')+'">'+esc(t.title)+'</b>'+(t.note?'<p>'+esc(t.note)+'</p>':'')+'</div><button class="btn ghost" style="padding:6px 9px" data-action="edit-task" data-id="'+t.id+'">···</button></div>').join(''):'<div class="empty">Пока нет задач. Добавь первое дело.</div>')+'<div style="margin-top:14px">'+btn('+ Записать задачу','add-task','light')+'</div></section><section class="card">'+head('Расписание',btn('+ Событие','add-schedule'))+(sched.length?sched.map(s=>'<div class="row-item"><div class="time">'+esc(s.time||'—')+'</div><div class="dot"></div><div class="row-main"><b>'+esc(s.title)+'</b>'+(s.note?'<p>'+esc(s.note)+'</p>':'')+'</div><button class="btn ghost" style="padding:6px 9px" data-action="delete-schedule" data-id="'+s.id+'">×</button></div>').join(''):'<div class="empty">Запланируй встречи, поездки и важные дела.</div>')+'<div class="section-head"><h2>Заметка дня</h2></div><textarea id="quick-journal" class="field" style="width:100%;border:1px solid #dfe4eb;border-radius:12px;padding:12px;min-height:100px" placeholder="Что важно не забыть? Как прошёл день?">'+esc(entry?.text||'')+'</textarea><div class="form-actions">'+btn('Сохранить заметку','save-journal')+'</div></section></div><div style="margin-top:16px" class="metric-grid">'+metric('Доходы сегодня',money(state.transactions.filter(t=>t.date===selectedDate&&t.type==='income').reduce((s,t)=>s+ +t.amount,0)),'Записанные поступления','positive')+metric('Расходы сегодня',money(state.transactions.filter(t=>t.date===selectedDate&&t.type==='expense').reduce((s,t)=>s+ +t.amount,0)),'Записанные затраты','negative')+metric('Чистый результат',money(state.transactions.filter(t=>t.date===selectedDate).reduce((s,t)=>s+(t.type==='income'?1:-1)*Number(t.amount),0)),'Доходы минус расходы')+'</div>';
}
function renderJournal(){
const entries=[...state.journal].sort((a,b)=>b.date.localeCompare(a.date));
return head('Личный журнал',btn('+ Новая запись','add-journal'))+'<div class="card">'+(entries.length?entries.map(e=>'<div class="row-item"><div class="dot"></div><div class="row-main"><b>'+fmtDate(e.date)+'</b><div class="journal-entry">'+esc(e.text)+'</div><div class="actions" style="margin-top:9px">'+btn('Редактировать','edit-journal:'+e.id,'ghost')+btn('Удалить','delete-journal:'+e.id,'danger')+'</div></div></div>').join(''):'<div class="empty">Тут будут твои мысли, идеи, события и итоги дней.</div>')+'</div>';
}
function renderObjects(){
return head('Рабочие объекты',btn('+ Добавить объект','add-object'))+(state.objects.length?'<div class="grid">'+state.objects.map(o=>{const exp=totalExpense(o.id),inc=totalIncome(o.id),profit=objProfit(o),margin=Number(o.revenue)>0?Math.round(profit/Number(o.revenue)*100):0;return '<section class="card object-card"><div class="object-title"><div><h3>'+esc(o.name)+'</h3><div class="muted small" style="margin-top:4px">'+esc(o.client||'Заказчик не указан')+'</div></div><span class="pill '+(o.status==='Завершён'?'gray':'')+'">'+esc(o.status||'В работе')+'</span></div><div class="object-numbers"><div><span>Цена договора</span><b>'+money(o.revenue)+'</b></div><div><span>Расходы</span><b class="negative">'+money(exp)+'</b></div><div><span>Прибыль</span><b class="'+(profit>=0?'positive':'negative')+'">'+money(profit)+'</b></div></div><div class="progress"><span style="width:'+Math.max(0,Math.min(100,margin))+'%"></span></div><div class="muted small">Маржа: '+margin+'% · Поступило: '+money(inc)+'</div>'+(o.note?'<div class="note-box">'+esc(o.note)+'</div>':'')+'<div class="actions">'+btn('+ Расход','add-transaction:expense:'+o.id,'light')+btn('+ Доход','add-transaction:income:'+o.id,'light')+btn('Изменить','edit-object:'+o.id,'ghost')+btn('Удалить','delete-object:'+o.id,'danger')+'</div></section>'}).join('')+'</div>':'<div class="card empty">Добавь первый объект, укажи цену работ и учитывай каждый расход. Приложение покажет фактическую прибыль.</div>');
}
function renderFinance(){
const ins=totalIncomes(),outs=totalExpenses(),objRevenue=state.objects.reduce((s,o)=>s+Number(o.revenue||0),0);
const tx=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));
return '<div class="section-head"><h2>Финансы и результат</h2><div class="actions">'+btn('+ Операция','add-transaction','light')+btn('Экспорт JSON','export','ghost')+btn('Восстановить копию','import','ghost')+'</div><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div><div class="metric-grid">'+metric('Поступления',money(ins),'Фактический доход','positive')+metric('Расходы',money(outs),'Все записанные затраты','negative')+metric('Денежный результат',money(ins-outs),'Поступления − расходы',(ins-outs>=0?'positive':'negative'))+'</div><div class="grid" style="margin-top:16px"><section class="card">'+head('Сводка по объектам')+(state.objects.length?'<table class="table"><thead><tr><th>Объект</th><th>Расходы</th><th>Прибыль*</th></tr></thead><tbody>'+state.objects.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+money(totalExpense(o.id))+'</td><td class="'+(objProfit(o)>=0?'positive':'negative')+'">'+money(objProfit(o))+'</td></tr>').join('')+'</tbody></table><p class="muted small">* Цена договора минус учтённые расходы; поступления показаны отдельно.</p>':'<div class="empty">Добавь объект, чтобы видеть прибыль.</div>')+'</section><section class="card">'+head('Операции',btn('+ Добавить','add-transaction','light'))+(tx.length?tx.slice(0,8).map(t=>'<div class="row-item"><div class="dot" style="background:'+(t.type==='income'?'#16845b':'#d85a60')+'"></div><div class="row-main"><b>'+esc(t.title|| (t.type==='income'?'Поступление':'Расход'))+'</b><p>'+fmtDate(t.date)+' · '+esc(objName(t.objectId))+(t.category?' · '+esc(t.category):'')+'</p></div><b class="'+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</b><button class="btn ghost" style="padding:5px 8px" data-action="delete-transaction" data-id="'+t.id+'">×</button></div>').join(''):'<div class="empty">Записей пока нет.</div>')+'</section></div>';
}
function field(label,name,type='text',value='',extra=''){return '<div class="field"><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function selectField(label,name,options,value){return '<div class="field"><label for="'+name+'">'+label+'</label><select id="'+name+'" name="'+name+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>'}
function textareaField(label,name,value='',full=true){return '<div class="field '+(full?'full':'')+'"><label for="'+name+'">'+label+'</label><textarea id="'+name+'" name="'+name+'">'+esc(value)+'</textarea></div>'}
function renderModal(){
let title='',body='',item=null;const m=modal;const parts=m.action.split(':');const a=parts[0],id=parts[1],extra=parts[2];
if(a==='add-task'||a==='edit-task'){item=state.tasks.find(x=>x.id===id)||{};title=a==='add-task'?'Новая задача':'Изменить задачу';body='<form id="entity-form" data-kind="task"><div class="form-grid">'+field('Название','title','text',item.title||'','required')+field('Дата','date','date',item.date||selectedDate,'required')+field('Время','time','time',item.time||'09:00')+textareaField('Комментарий','note',item.note||'')+'</div><div class="form-actions">'+btn('Отмена','close-modal','ghost')+'<button class="btn" type="submit">Сохранить</button></div></form>'}
else if(a==='add-schedule'){title='Новое событие';body='<form id="entity-form" data-kind="schedule"><div class="form-grid">'+field('Название','title','text','','required')+field('Дата','date','date',selectedDate,'required')+field('Время','time','time','12:00')+textareaField('Комментарий','note','')+'</div><div class="form-actions">'+btn('Отмена','close-modal','ghost')+'<button class="btn" type="submit">Сохранить</button></div></form>'}
else if(a==='add-object'||a==='edit-object'){item=state.objects.find(x=>x.id===id)||{};title=a==='add-object'?'Новый объект':'Изменить объект';body='<form id="entity-form" data-kind="object" data-id="'+(item.id||'')+'"><div class="form-grid">'+field('Название объекта','name','text',item.name||'','required')+field('Заказчик','client','text',item.client||'')+field('Цена договора (₽)','revenue','number',item.revenue||0,'min="0" step="0.01" required')+selectField('Статус','status',[['В работе','В работе'],['Ожидает','Ожидает'],['Завершён','Завершён']],item.status||'В работе')+field('Дата начала','date','date',item.date||selectedDate)+textareaField('Примечания','note',item.note||'')+'</div><div class="form-actions">'+btn('Отмена','close-modal','ghost')+'<button class="btn" type="submit">Сохранить объект</button></div></form>'}
else if(a==='add-transaction'){const type= id==='income'?'income':id==='expense'?'expense':'expense';const obj=extra||'';title=type==='income'?'Записать доход':'Записать расход';body='<form id="entity-form" data-kind="transaction"><div class="form-grid">'+selectField('Тип операции','type',[['expense','Расход'],['income','Доход']],type)+field('Сумма (₽)','amount','number','','min="0.01" step="0.01" required')+field('Дата','date','date',selectedDate,'required')+selectField('Объект','objectId',[['','Без объекта'],...state.objects.map(o=>[o.id,o.name])],obj)+selectField('Категория','category',[['Материалы','Материалы'],['Работа','Работа / зарплата'],['Транспорт','Транспорт'],['Оборудование','Оборудование'],['Субподряд','Субподряд'],['Прочее','Прочее']], 'Материалы')+field('Описание','title','text','','required')+textareaField('Комментарий','note','')+'</div><div class="form-actions">'+btn('Отмена','close-modal','ghost')+'<button class="btn" type="submit">Сохранить операцию</button></div></form>'}
else if(a==='add-journal'||a==='edit-journal'){item=state.journal.find(x=>x.id===id)||{};title=a==='add-journal'?'Новая запись':'Редактировать запись';body='<form id="entity-form" data-kind="journal" data-id="'+(item.id||'')+'"><div class="form-grid">'+field('Дата','date','date',item.date||selectedDate,'required')+textareaField('Текст записи','text',item.text||'')+'</div><div class="form-actions">'+btn('Отмена','close-modal','ghost')+'<button class="btn" type="submit">Сохранить</button></div></form>'}
return '<div class="overlay" data-action="overlay-close"><div class="modal"><div class="modal-head"><h2>'+title+'</h2><button class="close" data-action="close-modal">×</button></div>'+body+'</div></div>';
}
function toast(s){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2300)}
function open(action){modal={action};render()}
function close(){modal=null;render()}
function saveJournal(){let text=$('#quick-journal').value.trim();let existing=state.journal.find(j=>j.date===selectedDate);if(existing){existing.text=text}else if(text){state.journal.push({id:uid(),date:selectedDate,text})}save();toast('Заметка сохранена');render()}
function submitForm(form){const data=new FormData(form),v=Object.fromEntries(data.entries()),kind=form.dataset.kind,id=form.dataset.id;if(kind==='task'){if(id){Object.assign(state.tasks.find(x=>x.id===id),v)}else state.tasks.push({...v,id:uid(),done:false})}
if(kind==='schedule')state.schedule.push({...v,id:uid()});
if(kind==='object'){let obj={...v,revenue:Number(v.revenue)||0};if(id)Object.assign(state.objects.find(x=>x.id===id),obj);else state.objects.push({...obj,id:uid()})}
if(kind==='transaction')state.transactions.push({...v,id:uid(),amount:Number(v.amount)||0,objectId:v.objectId||''});
if(kind==='journal'){let e=state.journal.find(x=>x.id===id);if(e)Object.assign(e,{date:v.date,text:v.text});else state.journal.push({...v,id:uid()})}
save();modal=null;render();toast('Сохранено')}
function exportData(){const blob=new Blob([JSON.stringify({app:'moya-zhizn',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moya-zhizn-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Резервная копия готова')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const data=parsed&&parsed.app==='moya-zhizn'?parsed.data:parsed;const keys=['tasks','entries','objects','transactions','journal','schedule'];if(!data||typeof data!=='object'||!keys.every(k=>Array.isArray(data[k])))throw new Error('Неподходящий формат копии');if(!confirm('Восстановить данные из файла? Текущие данные будут заменены. Перед заменой будет создана локальная страховочная копия.'))return;try{localStorage.setItem('moya-zhizn-before-restore',JSON.stringify({savedAt:new Date().toISOString(),data:state}))}catch(e){}state={...defaultState(),...data};save();modal=null;render();toast('Копия восстановлена')}catch(e){alert('Не удалось восстановить копию. Выбери JSON-файл, экспортированный из приложения «Моя жизнь».')}};reader.onerror=()=>alert('Не удалось прочитать файл. Попробуй ещё раз.');reader.readAsText(file)}
function bindEvents(){
document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;modal=null;render()}));
document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{const action=el.dataset.action;if(el.classList.contains('check'))return;if(action==='overlay-close'&&e.target!==el)return;if(action==='overlay-close'||action==='close-modal'){close();return}
if(action==='prev-day'||action==='next-day'){let d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+(action==='prev-day'?-1:1));selectedDate=d.toISOString().slice(0,10);render();return}
if(action==='save-journal'){saveJournal();return}
if(action==='export'){exportData();return}
if(action==='import'){const input=$('#import-file');if(input)input.click();return}
if(action==='add-task'||action==='edit-task'||action==='add-schedule'||action==='add-object'||action==='edit-object'||action==='add-transaction'||action==='add-journal'||action==='edit-journal'){open(action);return}
if(action==='toggle-task'){let t=state.tasks.find(x=>x.id===el.dataset.id);if(t)t.done=el.checked;save();render();return}
if(action==='delete-schedule'){state.schedule=state.schedule.filter(x=>x.id!==el.dataset.id);save();render();return}
if(action==='delete-transaction'){state.transactions=state.transactions.filter(x=>x.id!==el.dataset.id);save();render();return}
if(action.startsWith('delete-journal:')){const id=action.split(':')[1];state.journal=state.journal.filter(x=>x.id!==id);save();render();return}
if(action.startsWith('add-transaction:')){const [,type,objId]=action.split(':');open('add-transaction:'+type+':'+objId);return}
if(action.startsWith('edit-journal:')){open('edit-journal:'+action.split(':')[1]);return}
if(action.startsWith('delete-object:')){let id=action.split(':')[1];if(confirm('Удалить объект? Операции останутся в журнале, но потеряют привязку к объекту.')){state.objects=state.objects.filter(x=>x.id!==id);state.transactions.forEach(t=>{if(t.objectId===id)t.objectId='' });save();render()}return}
if(action.startsWith('delete-journal:')){let id=action.split(':')[1];state.journal=state.journal.filter(x=>x.id!==id);save();render();return}
if(action.startsWith('edit-object:')){open('edit-object:'+action.split(':')[1]);return}
if(action.startsWith('edit-task:')){open('edit-task:'+action.split(':')[1]);return}
}));
document.querySelectorAll('[data-action="toggle-task"]').forEach(el=>el.addEventListener('change',()=>{const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){t.done=el.checked;save();render()}}));
const importInput=$('#import-file');if(importInput)importInput.addEventListener('change',()=>{const file=importInput.files&&importInput.files[0];if(file)importData(file);importInput.value=''});
const date=$('#selected-date');if(date)date.addEventListener('change',()=>{selectedDate=date.value||today();render()});
const form=$('#entity-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();submitForm(form)});
}
try {
  render();
} catch (error) {
  console.error('App render failed:', error);
  const root=document.querySelector('#root');
  if(root) root.innerHTML='<main style="margin:24px;padding:24px;background:white;border:1px solid #f0b4b4;border-radius:16px;font:16px system-ui;color:#7f1d1d"><h2>Не удалось отобразить приложение</h2><p>Локальные данные не удалены. Обнови страницу. Если ошибка повторится, сохрани резервную копию данных, прежде чем продолжать.</p><button onclick="location.reload()" style="padding:10px 16px">Перезагрузить приложение</button></main>';
}
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
